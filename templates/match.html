<!DOCTYPE html>
<html>
<head>
    <title>Football</title>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg-main: #f6fbf8;
  --green-main: #1f7a3f;
  --green-hover: #166534;
  --text-main: #1f7a3f;
  --text-muted: #5f7d6b;
  --border: #cfe8d8;
  --white: #ffffff;
}
body {
  background: var(--bg-main);
  color: var(--text-main);
}


.navbar {
  margin:0px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 24px;
  background: var(--green-main);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--white);
}

.navbar a {
  color: var(--white);
  text-decoration: none;
  margin-left: 20px;
  font-weight: 500;
  display: inline-block;
transition: transform 0.2s ease, opacity 0.2s ease;
}

.navbar a:hover {
  color: #fff;
  transform: scale(1.08) translateY(-2px) ;
}

.logo {
  font-size: 18px;
  font-weight: bold;
}

.btn {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  background: var(--green-main);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease,
              box-shadow 0.15s ease,
              background 0.15s ease;
}

.btn:hover {
  background: var(--green-hover);
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
}

.btn:active {
  transform: translateY(0);
  box-shadow: none;
}

h1{
    
    text-align: center;
}

table {
  width: 100%;
  background: var(--white);
  border: 1px solid var(--border);
  border-collapse: collapse;
}

th {
  background: var(--green-main);
  color: var(--white);
}

th, td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

td:nth-child(2) {
  font-weight: bold;
}

.team {
  display: flex;
  align-items: center;
  gap: 8px;
}

.team img {
  height: 24px;
  width: 24px;
  object-fit: contain;
}

.team.away {
  justify-content: flex-end;
}

.score {
  font-weight: bold;
  text-align: center;
}

form {
  margin-bottom: 20px;
}
select, button {
  padding: 6px 10px;
  margin-right: 10px;
}

.team-link {
  text-decoration: none;
  color: inherit;
}

.team-link:hover {
  opacity: 0.85;
}
form {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 24px 0;
 
  justify-content: center;

}
.league {
  background-image: url("data:image/svg+xml;utf8,<svg fill='%231f7a3f' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 18px;
}
.date::-webkit-calendar-picker-indicator {
  cursor: pointer;
  opacity: 0.7;
}

.date::-webkit-calendar-picker-indicator:hover {
  opacity: 1;
}
.date:focus,
.league:focus {
  outline: none;
  border-color: var(--green-main);
  box-shadow: 0 0 0 2px rgba(31,122,63,0.15);
}
.date,
.league {
   
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: white;
  color: var(--text-main);
  font-weight: 500;
  cursor: pointer;
}

.date:focus,
.league:focus {
  outline: none;
  border-color: var(--green-main);
}
</style>

</head>
<body>
    <nav class="navbar">
  <div class="nav-left">
    <span class="logo">Football Project</span>
  </div>

  <div class="nav-right">
    <a href="/match">Matches</a>
    <a href="#">Players</a>
    <a href="#">Competitions</a>
    <a href="#">leagues</a>
    <a href="/standings">standings</a>
  </div>
</nav>
    <h1>Football matches</h1>
    <form method="get" action="/match">
    <input type="date" name="date" class="date">
  <select name="league" class="league">
    <option value="PL">Premier League</option>
    <option value="PD">La Liga</option>
    <option value="SA">Serie A</option>
    <option value="BL1">Bundesliga</option>
    <option value="FL1">Ligue 1</option>
  </select>

  

  <button type="submit" class="btn">Show matches</button>

</form>
    <table>
  <tr>
    <th>Home</th>
    <th>Score</th>
    <th>Away</th>
  </tr>

  {% for match in matches %}
  <tr>
    <td>
    <a href="/club/{{ match.home_id }}" class="team-link">
      <div class="team">
        <img src="{{ match.home_logo }}" alt="">
        <span>{{ match.home }}</span>
      </div>
    </a>
    </td>
    
    <td class="score">{{ match.score }}</td>

    <td>
    <a href="/club/{{ match.away_id }}" class="team-link">
      <div class="team away">
        <span>{{ match.away }}</span>
        <img src="{{ match.away_logo }}" alt="" onerror="this.style.display='none'">
      </div>
    </a>
    </td>
  </tr>
  {% endfor %}
</table>
    
</body>
</html>
